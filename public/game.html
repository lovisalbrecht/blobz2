<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BLOBZ — Play</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d1e;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100dvh;
  overflow: hidden;
}
canvas { display: block; }

/* Joystick overlay */
#joystick-zone {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%; height: 45%;
  z-index: 10;
  touch-action: none;
  display: none;
}
#joystick-base {
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.25);
  pointer-events: none;
}
#joystick-knob {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  pointer-events: none;
}

/* Score overlay */
#score-screen {
  position: fixed;
  inset: 0;
  background: #0d0d1eee;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  font-family: 'Fredoka One', sans-serif;
  z-index: 100;
  color: #f0f0ff;
}
#score-screen h2 { font-size: 2.5rem; }
#score-list { list-style: none; display: flex; flex-direction: column; gap: 8px; min-width: 280px; }
#score-list li {
  background: #1a1a30;
  border-radius: 10px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
}
#score-list li .rank { font-size: 1.5rem; font-family: 'Fredoka One', sans-serif; width: 32px; text-align: center; }
#score-list li .pts { margin-left: auto; color: #f59e0b; font-family: 'Fredoka One', sans-serif; font-size: 1.1rem; }
#next-msg { color: #8888aa; font-size: 0.9rem; font-family: 'Nunito', sans-serif; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="joystick-zone">
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
</div>

<div id="score-screen">
  <h2>Runde vorbei!</h2>
  <ul id="score-list"></ul>
  <p id="next-msg">Nächstes Spiel startet gleich…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/game.js?v=7"></script>
</body>
</html>
